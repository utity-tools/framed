# Local development and tests only. These credentials are public on purpose; never reuse them.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: framed_owner
      POSTGRES_PASSWORD: framed_owner
      POSTGRES_DB: framed
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - framed_pgdata:/var/lib/postgresql/data
      # Runs once, on a fresh volume: creates the per-environment login users.
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U framed_owner -d framed"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  framed_pgdata:
