name: Feature request
description: Suggest a change or a new capability.
labels: [enhancement]
body:
  - type: dropdown
    id: zone
    attributes:
      label: Who is it for
      options:
        - Visitor (public pages)
        - Gallery (portal)
        - Operator (console)
        - Developer (repository, tooling)
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
